<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trayer Switchgear · RMU Production Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#1a2230;--ink2:#5a6573;--ink3:#8a94a2;--line:#dfe3e8;--line2:#eef1f4;
  --bg:#f4f6f8;--card:#fff;--steel:#5b6b7f;--steel-d:#3d4a5a;
  --green:#1f9d57;--green-bg:#e8f6ee;--red:#d83a3a;--red-bg:#fcebeb;
  --amber:#e8a000;--amber-bg:#fdf3df;--cyan:#1768c4;--cyan-bg:#e7f0fb;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--disp:'Barlow Semi Condensed',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
}
body.dark{
  --ink:#e8ecf1;--ink2:#a7b0bd;--ink3:#6f7886;--line:#2c3440;--line2:#222a34;
  --bg:#10151c;--card:#1a212b;--steel:#7f8ea3;--steel-d:#4a5a6e;
  --green:#3fc77e;--green-bg:#163326;--red:#f4615f;--red-bg:#3a1f20;
  --amber:#f0b43c;--amber-bg:#3a2e16;--cyan:#4f9be8;--cyan-bg:#16273a;
}
body.dark .login,body.dark .topbar,body.dark .panel,body.dark .kpi,body.dark .drawer,body.dark .sticker{background:var(--card)}
body.dark .row:hover,body.dark .node:hover,body.dark .qrrow:hover{background:#222a34}
body.dark .scan-box{background:var(--card)}
body.dark .s-scrap{background:#2c3440;color:#a7b0bd}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.mono{font-family:var(--mono)}button{font:inherit}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;width:min(380px,100%);box-shadow:0 8px 30px rgba(20,30,50,.08)}
.login .brand{display:flex;flex-direction:column;line-height:1;align-items:center;margin-bottom:6px}
.login .name{font-weight:700;font-size:28px;letter-spacing:.03em;color:var(--steel-d)}
.login .name b{color:var(--steel)}
.login .tag{font-size:10px;letter-spacing:.22em;color:var(--ink3);font-weight:600;margin-top:4px}
.login h1{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;text-align:center;color:var(--ink2);margin:18px 0 20px}
.login label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:5px;margin-top:14px}
.login input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:14px}
.login .err{color:var(--red);font-size:12px;margin-top:12px;min-height:16px}
.login button{margin-top:18px;width:100%;font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px;background:var(--steel-d);color:#fff;border:0;padding:13px;border-radius:10px;cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.brand .name{font-weight:700;font-size:21px;letter-spacing:.03em;color:var(--steel-d)}
.brand .name b{color:var(--steel)}
.brand .tag{font-size:9px;letter-spacing:.22em;color:var(--ink3);font-weight:600;margin-top:3px}
.tabs{display:flex;gap:6px;padding-left:18px;border-left:1px solid var(--line)}
.tab{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--ink2);background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer}
.tab.sel{background:var(--steel-d);color:#fff}
.topbar-meta{margin-left:auto;display:flex;align-items:center;gap:12px}
.who{font-size:12px;color:var(--ink2)}
.line-tag{font-size:11px;color:var(--ink2);border:1px solid var(--line);padding:5px 10px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.add{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:12px;background:var(--steel-d);color:#fff;border:0;padding:8px 14px;border-radius:7px;cursor:pointer}
.signout{font-family:var(--disp);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px;background:#fff;border:1px solid var(--line);color:var(--ink2);padding:7px 12px;border-radius:7px;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{text-align:left;background:#fff;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.kpi.sel{box-shadow:0 0 0 2px var(--steel-d) inset}
.kpi-n{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1}
.kpi-l{font-size:11px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.tone-active{border-top-color:var(--cyan)}.tone-active .kpi-n{color:var(--cyan)}
.tone-hold{border-top-color:var(--red)}.tone-hold .kpi-n{color:var(--red)}
.tone-shipped{border-top-color:var(--green)}.tone-shipped .kpi-n{color:var(--green)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel-head h2{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;margin:0}
.hint{font-size:12px;color:var(--ink3)}
.line{list-style:none;display:flex;flex-direction:column;margin:0;padding:4px 0}
.node{position:relative;display:flex;flex-direction:row;align-items:center;gap:14px;text-align:left;padding:7px 8px;border-radius:9px;border:0;background:none;width:100%;cursor:pointer;color:inherit}
.node:hover{background:var(--bg)}
.node.sel{background:var(--cyan-bg)}
.node-step{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.1em;width:22px;flex:none}
.node-dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:#fff;color:var(--ink3);font-family:var(--disp);font-weight:700;font-size:16px;z-index:2;flex:none}
.node-dot.lit{border-color:var(--steel-d);background:var(--steel-d);color:#fff}
.node-dot.bad{border-color:var(--red);background:var(--red);color:#fff}
.node-name{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--ink2);flex:1}
.node-count{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);padding-left:8px}
.node-count.lit{color:var(--steel-d)}.node-count.bad{color:var(--red)}
.node-link{position:absolute;left:38px;top:47px;width:1.5px;height:14px;background:var(--line);z-index:1}
.linebars{display:flex;align-items:flex-end;gap:8px;height:340px;padding:8px 4px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:auto;-webkit-overflow-scrolling:touch}
.linebars::-webkit-scrollbar{height:12px}
.linebars::-webkit-scrollbar-track{background:var(--line2);border-radius:6px}
.linebars::-webkit-scrollbar-thumb{background:var(--ink3);border-radius:6px}
.linebars::-webkit-scrollbar-thumb:hover{background:var(--ink2)}
.lbar{flex:0 0 64px;display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;cursor:pointer;height:100%;justify-content:flex-end;padding:0;color:inherit}
.lbar-num{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink2);margin-bottom:4px;min-height:18px}
.lbar-fill{width:70%;max-width:48px;background:var(--steel-d);border-radius:5px 5px 0 0;min-height:2px;transition:opacity .15s}
.lbar-fill.bad{background:var(--red)}
.lbar-fill.empty{background:var(--line2)}
.lbar:hover .lbar-fill{opacity:.78}
.lbar.sel .lbar-fill{outline:2px solid var(--cyan);outline-offset:2px}
.lbar-name{font-family:var(--disp);font-weight:600;font-size:10px;color:var(--ink2);margin-top:8px;text-align:center;line-height:1.15;max-width:64px}
.lbar-step{font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:2px}
.lbar-axis{height:1.5px;background:var(--line);margin:0 4px}
.rows{display:flex;flex-direction:column}
.drag-handle{display:inline-block;color:var(--ink3);cursor:grab;font-size:11px;letter-spacing:-2px;margin-right:2px;opacity:.55}
/* ---------- TV / floor display ---------- */
.tv{position:fixed;inset:0;background:#12141a;color:#fff;display:flex;flex-direction:column;z-index:9999;font-family:var(--disp),system-ui,sans-serif;overflow:hidden}
.tv-head{display:flex;align-items:center;gap:20px;padding:22px 40px;border-bottom:1px solid #262a35}
.tv-brand{font-size:30px;font-weight:800;letter-spacing:-.02em}
.tv-brand b{color:#4db8ff}
.tv-brand span{font-size:18px;font-weight:500;color:#8b93a5;margin-left:12px;letter-spacing:.06em;text-transform:uppercase}
.tv-clock{margin-left:auto;font-size:28px;font-weight:700;color:#c9d1e0;font-variant-numeric:tabular-nums}
.tv-exit{background:#262a35;color:#8b93a5;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer;font-family:inherit}
.tv-body{flex:1;padding:24px 36px;display:flex;flex-direction:column;gap:22px;min-height:0}
.tv-title{font-size:26px;font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
/* kpi strip */
.tv-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.tv-kpi{background:#1a1e28;border:1px solid #262a35;border-radius:16px;padding:20px 24px;text-align:center}
.tv-kpi.bad{border-color:#5c3330;background:#241a1a}
.tv-kpi.good{border-color:#2c5238;background:#17241c}
.tv-kpi.warn{border-color:#5c4a24;background:#241f16}
.tv-kn{font-size:58px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tv-kpi.bad .tv-kn{color:#ff8a7d}
.tv-kpi.good .tv-kn{color:#63d68d}
.tv-kpi.warn .tv-kn{color:#ffc963}
.tv-kl{font-size:16px;color:#8b93a5;margin-top:8px;font-weight:600}
/* line section */
.tv-line-sec{flex:1.1;display:flex;flex-direction:column;min-height:0}
.tv-linebars{flex:1;display:flex;align-items:flex-end;gap:8px;min-height:0}
.tv-lbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.tv-lnum{font-size:22px;font-weight:800;margin-bottom:6px;min-height:28px;color:#fff}
.tv-lfill{width:100%;background:linear-gradient(180deg,#4db8ff,#2b7fd4);border-radius:6px 6px 0 0;min-height:0}
.tv-lfill.bad{background:linear-gradient(180deg,#ff7a6d,#d94b3d)}
.tv-lfill.empty{background:#262a35}
.tv-lname{font-size:17px;color:#c9d1e0;margin-top:10px;text-align:center;line-height:1.25;font-weight:800;letter-spacing:.01em}
/* three columns */
.tv-cols{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;min-height:0}
.tv-col{background:#1a1e28;border:1px solid #262a35;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;overflow:hidden}
.tv-ctitle{font-size:22px;font-weight:800;margin-bottom:10px;flex-shrink:0}
.tv-ctitle.crit{color:#ff6b5e}
.tv-ctitle.bad{color:#ffb84d}
.tv-ctitle.warn{color:#ffc963}
.tv-cempty{font-size:18px;color:#5f6878}
/* auto-scrolling viewport: the track duplicates its rows and slides up continuously */
.tv-scroll{flex:1;overflow:hidden;position:relative;min-height:0}
.tv-track{display:flex;flex-direction:column;gap:10px;animation:tvscroll linear infinite}
.tv-track.still{animation:none}
@keyframes tvscroll{ from{transform:translateY(0)} to{transform:translateY(-50%)} }
.tv-crow{display:flex;align-items:center;gap:12px;background:#12141a;border-radius:10px;padding:12px 14px;flex-wrap:wrap;flex-shrink:0}
.tv-cserial{font-size:20px;font-weight:800;font-family:var(--mono),monospace;color:#fff}
.tv-cstn{font-size:16px;color:#4db8ff;font-weight:700;margin-left:auto}
.tv-cop{font-size:15px;color:#63d68d;font-weight:700;width:100%}
.tv-cnote{font-size:15px;color:#ffb84d;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-cdue{font-size:16px;color:#ffc963;font-weight:700;width:100%}
.tv-cdue.over{color:#ff8a7d}
.row[draggable="true"]:hover .drag-handle{opacity:1}
.row{display:grid;grid-template-columns:1.3fr 1.2fr 1.2fr .9fr .8fr;gap:14px;align-items:center;padding:13px 12px;border:0;border-bottom:1px solid var(--line2);background:none;color:var(--ink);text-align:left;cursor:pointer;width:100%;font-size:13px}
.row:hover{background:var(--bg)}
.row.head{cursor:default;font-family:var(--disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--ink3)}
.serial{font-size:12.5px;font-weight:500}
.cust{display:flex;flex-direction:column;gap:2px}.cust strong{font-weight:600}.cust em{font-style:normal;font-size:11px;color:var(--ink3)}
.stn{color:var(--ink2)}
.prog{display:flex;align-items:center;gap:9px}
.bar{flex:1;height:6px;background:var(--line2);border-radius:4px;overflow:hidden;min-width:46px}
.fill{display:block;height:100%;background:var(--steel-d)}
.prog em{font-style:normal;font-size:11px;color:var(--ink2)}
.pill{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:20px;text-align:center;white-space:nowrap}
.s-active{background:var(--cyan-bg);color:var(--cyan)}.s-hold{background:var(--red-bg);color:var(--red)}.s-shipped{background:var(--green-bg);color:var(--green)}.s-scrap{background:#eceef0;color:#5a6573}
.tmark{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tmark.ok{background:var(--green-bg);color:var(--green)}
.tmark.near{background:var(--amber-bg);color:var(--amber)}
.tmark.over{background:var(--red-bg);color:var(--red)}
.tmark.none{background:var(--line2);color:var(--ink3)}
.insp-list{display:flex;flex-direction:column;gap:10px}
.insp-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.insp-crit{font-size:12.5px;color:var(--ink);margin-bottom:8px;line-height:1.4}
.insp-btns{display:flex;gap:7px}
.insp-choice{font-family:var(--disp);font-weight:700;letter-spacing:.04em;font-size:12px;padding:7px 14px;border-radius:7px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
body.dark .insp-choice{background:var(--card)}
.insp-choice.acc.on{background:var(--green);border-color:var(--green);color:#fff}
.insp-choice.rej.on{background:var(--red);border-color:var(--red);color:#fff}
.insp-choice.na.on{background:var(--ink3);border-color:var(--ink3);color:#fff}
.m-select{font-family:var(--body);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
body.dark .m-select{background:var(--card);color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--ink3)}
.scrim{position:fixed;inset:0;background:rgba(26,34,48,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,92vw);z-index:50;background:#fff;border-left:1px solid var(--line);padding:22px;overflow-y:auto}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.serial.big{font-size:17px;font-weight:600}
.drawer-sub{font-size:12px;color:var(--ink2);margin-top:4px}
.x{background:#fff;border:1px solid var(--line);color:var(--ink2);width:32px;height:32px;border-radius:7px;font-size:20px;cursor:pointer;line-height:1}
.drawer-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0;padding:14px;background:var(--bg);border-radius:9px;border:1px solid var(--line)}
.drawer-meta div{display:flex;flex-direction:column;gap:3px}
.drawer-meta span{font-size:10px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.drawer-meta strong{font-size:13px;font-weight:600}
.rework-flag{background:var(--red-bg);border:1px solid var(--red);border-radius:9px;padding:12px 14px;margin-bottom:16px}
.rework-flag .rf-title{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--red);margin-bottom:4px}
.rework-flag .rf-note{font-size:12.5px;color:var(--ink2)}
.traveler-label{font-family:var(--disp);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--ink3);margin-bottom:10px}
.traveler{list-style:none;margin:0;padding:0}
.tstep{display:flex;gap:13px;padding-bottom:14px;position:relative}
.tstep:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:-2px;width:1.5px;background:var(--line)}
.tstep.done:not(:last-child)::before{background:var(--green)}
.t-mark{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink3);z-index:1}
.tstep.done .t-mark{background:var(--green);border-color:var(--green);color:#fff}
.tstep.active .t-mark{background:var(--cyan);border-color:var(--cyan);color:#fff}
.tstep.hold .t-mark{background:var(--red);border-color:var(--red);color:#fff}
.t-body{flex:1;padding-top:2px}
.t-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-name{font-family:var(--disp);font-weight:600;font-size:13.5px}
.t-state{font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.t-state.done{color:var(--green)}.t-state.active{color:var(--cyan)}.t-state.hold{color:var(--red)}.t-state.pending{color:var(--ink3)}
.t-detail{display:flex;gap:12px;font-size:11px;color:var(--ink2);margin-top:3px}
.t-note{font-size:11.5px;color:var(--ink2);margin-top:5px;padding:6px 9px;background:var(--bg);border-radius:6px;border-left:2px solid var(--line)}
.t-note.bad{color:var(--red);border-left-color:var(--red);background:var(--red-bg)}
.drawer-action{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.primary{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;background:var(--steel-d);color:#fff;border:0;padding:12px 16px;border-radius:9px;cursor:pointer;width:100%}
.btn-fail{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;background:#fff;color:var(--red);border:1.5px solid var(--red);padding:11px 16px;border-radius:9px;cursor:pointer;width:100%;margin-top:10px}
.btn-fail:hover{background:var(--red-bg)}
.btn-return{font-family:var(--disp);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13px;background:var(--green);color:#fff;border:0;padding:12px 16px;border-radius:9px;cursor:pointer;width:100%}
.action-note{font-size:11px;color:var(--ink3);margin:9px 2px 0;line-height:1.4}
.loading{padding:60px;text-align:center;color:var(--ink3);font-size:15px}
.form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.form label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:600;display:flex;flex-direction:column;gap:5px}
.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:13px}
.form textarea{font-family:var(--body);min-height:70px;resize:vertical}
.qr-tools{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.qr-search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:14px}
.selall{font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:12px;background:#fff;border:1px solid var(--line);color:var(--ink2);padding:9px 14px;border-radius:8px;cursor:pointer}
.qrlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qrrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.qrrow:hover{background:var(--bg)}
.qrrow:last-child{border-bottom:0}
.qrrow .chk{width:18px;height:18px;border:1.5px solid var(--ink3);border-radius:4px;display:grid;place-items:center;flex:none;font-size:12px;color:#fff}
.qrrow.on .chk{background:var(--steel-d);border-color:var(--steel-d)}
.qrrow .qr-serial{font-family:var(--mono);font-weight:600;font-size:13px}
.qrrow .qr-cust{font-size:12px;color:var(--ink3)}
.qrrow .qr-wo{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.printbtn{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;background:var(--steel-d);color:#fff;border:0;padding:10px 18px;border-radius:9px;cursor:pointer}
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
.sticker{border:1.5px solid var(--ink);border-radius:10px;padding:18px 14px;text-align:center}
.sticker .s-brand{font-weight:700;font-size:17px;letter-spacing:.03em;color:var(--steel-d)}
.sticker .s-brand b{color:var(--steel)}
.sticker .s-tag{font-size:7px;letter-spacing:.18em;color:var(--ink3);font-weight:600;margin-bottom:8px}
.sticker .s-model{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:12px;margin-bottom:6px}
.sticker .qr-box{display:flex;justify-content:center;margin:6px 0}
.sticker .qr-box svg{width:150px;height:150px}
.sticker .s-serial{font-family:var(--mono);font-weight:600;font-size:15px;margin-top:8px}
.sticker .s-order{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:3px}
.scan-modal{position:fixed;inset:0;background:rgba(26,34,48,.8);z-index:60;display:grid;place-items:center;padding:20px}
.scan-box{background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;text-align:center}
.scan-box h3{font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:16px;margin:0 0 4px}
.scan-box .sub{font-size:12px;color:var(--ink3);margin-bottom:14px}
.scan-video{width:100%;border-radius:12px;background:#000;aspect-ratio:1/1;object-fit:cover}
.scan-msg{font-size:13px;color:var(--ink2);margin-top:12px;min-height:18px}
.scan-close{margin-top:16px;width:100%;font-family:var(--disp);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;background:#fff;border:1px solid var(--line);color:var(--ink2);padding:12px;border-radius:10px;cursor:pointer}
@media print{
  @page{ size:auto; margin:0; }
  body *{visibility:hidden}
  #print-sheet,#print-sheet *{visibility:visible}
  #print-sheet{position:absolute;inset:0;display:block;padding:0;margin:0}
  .sticker{
    page-break-after:always;
    break-after:page;
    width:4in;height:4in;
    box-sizing:border-box;
    margin:0.5in auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:2px solid #000;border-radius:10px;
    padding:0.25in;
    overflow:hidden;
  }
  .sticker:last-child{page-break-after:auto;break-after:auto}
  .sticker .qr-box{width:2.2in;height:2.2in;display:flex;align-items:center;justify-content:center}
  .sticker .qr-box svg{width:100%;height:100%}
  .sticker .s-serial{font-size:20px;font-weight:800;margin-top:8px}
  .sticker .s-order{font-size:12px}
  .sticker .s-model{font-size:12px;letter-spacing:.08em}
}
@media(max-width:760px){
  .topbar{gap:12px}.tabs{padding-left:0;border-left:0}
  .kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr auto;gap:8px}.row .stn,.row .prog{display:none}.row.head{display:none}
  .sheet{grid-template-columns:1fr}
}

async function logStationWorker(stationIdx, empId){
  if(stationIdx==null || !empId) return;
  try{
    await setDoc(doc(db,"stationLog",String(stationIdx)),{
      station:stationIdx,
      stationName:(STATIONS[stationIdx]?STATIONS[stationIdx].full:("Station "+stationIdx)),
      empId:empId,
      at:new Date().toISOString()
    });
  }catch(e){ /* non-critical */ }
}
// ---- Station-guest session persistence (survives a page refresh) ----
var GUEST_KEY="sf_guest_session";
function saveGuestSession(){
  try{
    if(state.isStationGuest && state.workerStation!=null){
      localStorage.setItem(GUEST_KEY, JSON.stringify({station:Number(state.workerStation), emp:state._lastEmp||""}));
    }
  }catch(e){}
}
function loadGuestSession(){
  try{
    var raw=localStorage.getItem(GUEST_KEY);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(o && o.station!=null) return o;
  }catch(e){}
  return null;
}
function clearGuestSession(){
  try{ localStorage.removeItem(GUEST_KEY); }catch(e){}
}
async function loadRoleThenUnits(){
  // reset transient view state on every login
  state.openId=null; state.adding=false; state.failing=null; state.returning=null; state.filter="all"; state.stationFilter=null;
  // Scan-to-enter: if the shared floor account signed in, force worker at the scanned station
  if(state.user && (state.user.email||"").toLowerCase()===FLOOR_EMAIL && state._pendingStation!=null){
    state.role="worker"; state.workerStation=Number(state._pendingStation); state.tab="floor"; state.isStationGuest=true;
    state._pendingStation=null; state.showManagerLogin=false;
    saveGuestSession();
    loadStationAccess(); loadUnits(); loadAnnouncements(); startWorkerAnnPoll();
    return;
  }
  // Refresh/reload: the floor account is still signed in — restore the saved station + ID.
  if(state.user && (state.user.email||"").toLowerCase()===FLOOR_EMAIL){
    var sess=loadGuestSession();
    if(sess && sess.station!=null){
      state.role="worker"; state.workerStation=Number(sess.station); state.tab="floor"; state.isStationGuest=true;
      state._lastEmp=sess.emp||""; state.showManagerLogin=false;
      loadStationAccess(); loadUnits(); loadAnnouncements(); startWorkerAnnPoll();
      return;
    }
  }
  // default manager if not listed
  state.role="manager"; state.workerStation=null; state.tab="dash"; state.isStationGuest=false;
  try{
    var snap=await getDoc(doc(db,"users",(state.user.email||"").toLowerCase()));
    if(snap.exists()){
      var d=snap.data();
      if(d.role==="worker"){ state.role="worker"; state.workerStation=(d.station==null?null:Number(d.station)); state.tab="floor"; }
      else { state.role="manager"; state.tab="dash"; }
    }
  }catch(e){ /* default manager */ }
  loadStationAccess();
  publishStations();   // keep the backend's station list in step with the app
  loadUnits();
  loadGoals();         // monthly shipping goals
  loadAnnouncements();  // background load so the unread badge can show
  startWorkerAnnPoll();
  startDashPoll();      // live auto-refresh of the dashboard
}
// Background poll for workers so new announcements show up on the floor view
// Live auto-refresh for the manager's screens. Silently pulls fresh units on a
// timer and re-renders — but ONLY when it's safe (not mid-typing, no drawer/modal
// open, no drag happening), so it never interrupts what the manager is doing.
var _dashPoll=null;
function startDashPoll(){
  if(_dashPoll) return;
  _dashPoll=setInterval(function(){
    if(!state.user || state.role==="worker"){ return; }
    if(state.tab!=="dash" && state.tab!=="reports" && state.tab!=="analytics"){ return; }
    if(state.openId||state.shipDetail||state.adding||state.failing||state.returning||
       state.rmaUnit||state.reworkBack||state.scanUnit||signState||state.shipMonthPopup){ return; }
    var ae=document.activeElement;
    if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable)){ return; }
    if(state._dragging){ return; }
    silentRefreshUnits();
  }, 15000);
}
function stopDashPoll(){ if(_dashPoll){ clearInterval(_dashPoll); _dashPoll=null; } }
async function silentRefreshUnits(){
  try{
    var snap=await getDocs(collection(db,"units"));
    var arr=[]; snap.forEach(function(d){ arr.push(d.data()); });
    arr.sort(function(a,b){return (a.id<b.id?-1:1);});
    state.units=arr;
    var ae=document.activeElement;
    if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable)) return;
    if(state.openId||state.shipDetail||state.adding||state.failing||state.returning||
       state.rmaUnit||state.reworkBack||state.scanUnit||signState||state.shipMonthPopup) return;
    render();
  }catch(e){}
}
function startWorkerAnnPoll(){
  if(state.annPoll) return;
  state.annPoll=setInterval(function(){
    if(!state.user){ clearInterval(state.annPoll); state.annPoll=null; return; }
    if(state.role!=="worker") return;
    // don't reload while typing an employee id etc. is fine; just refresh announcements
    if(!state.annLoading) loadAnnouncements();
  }, 30000);
}
// Count announcements this worker hasn't acknowledged yet
function unreadAnnCount(){
  if(state.role!=="worker") return 0;
  var me=(state.user&&state.user.email||"").toLowerCase();
  var ackKey=me;
  var si=state.workerStation;
  if(si!=null && STATIONS[si]){ ackKey="station:"+STATIONS[si].key; }
  return (state.announcements||[]).filter(function(a){
    var forMe = (a.to==null) || (a.to && a.to.toLowerCase()===me);
    var acked = a.reads && (a.reads[ackKey] || a.reads[me]);
    return forMe && !acked;
  }).length;
}

// ---- Station access: which employee IDs may work each station ----
// Stored in Firestore collection "stationAccess", doc id = station index, { ids: ["4471","4208"] }
// ---------- Publish the station list so the backend reads the same lineup ----------
// The app is the single source of truth for stations and cycle times. This writes
// the current list to config/stations so the integration API can read it instead of
// keeping its own copy. Only writes when something actually changed.
async function publishStations(){
  if(state.role==="worker") return;              // managers only
  try{
    var payload = STATIONS.map(function(s,i){
      return { index:i, key:s.key, name:s.full, short:s.short, cycleMinutes:(s.cycle==null?null:s.cycle) };
    });
    var fingerprint = JSON.stringify(payload);
    var ref = doc(db,"config","stations");
    var snap = await getDoc(ref);
    if(snap.exists() && snap.data() && snap.data().fingerprint === fingerprint) return; // unchanged
    await setDoc(ref, {
      stations: payload,
      count: payload.length,
      plannedMinutes: payload.reduce(function(t,x){ return t + (x.cycleMinutes||0); },0),
      fingerprint: fingerprint,
      updatedAt: new Date().toISOString(),
      updatedBy: (state.user && state.user.email) || "manager"
    });
  }catch(e){ /* never block the app over this */ }
}

function unitState(u){
  var lastDone=-1,activeIdx=-1,holdIdx=-1; var stamps=u.stamps||{};
  STATIONS.forEach(function(s,i){var st=stamps[s.key];if(!st)return;if(st.hold)holdIdx=i;else if(st.active)activeIdx=i;else lastDone=i;});
  var done=Object.keys(stamps).filter(function(k){var s=stamps[k];return s&&!s.active&&!s.hold;}).length;
  var lastKey=STATIONS[N-1].key;
  var shipped=stamps[lastKey]&&!stamps[lastKey].active&&!stamps[lastKey].hold;
  var current,status;
  if(u.rework){ current=(typeof u.reworkStation==="number"?u.reworkStation:Math.max(0,lastDone)); status="rework"; }
  else if(u.scrapped){ current=(typeof u.scrapStation==="number"?u.scrapStation:Math.max(0,lastDone)); status="scrapped"; }
  else if(holdIdx>=0){current=holdIdx;status="hold";}else if(shipped){current=N-1;status="shipped";}
  else if(activeIdx>=0){current=activeIdx;status="active";}else{current=Math.min(lastDone+1,N-1);status="active";}
  return {done:done,current:current,status:status,holdIdx:holdIdx};
}

function stampTimeBadge(stamp){

// ===== Per-unit work timer (start/pause/done) + comment log =====
// Stored on the unit as u.work = { running:bool, startedAt:iso, elapsedMs:int } — for the CURRENT station.
// Comments stored as u.comments = [{by,at,text,station}]
function workElapsedMs(u){
  var w=u.work||{};
  var base=w.elapsedMs||0;
  if(w.running && w.startedAt){ base += (Date.now()-new Date(w.startedAt).getTime()); }
  return base;
}
function cycleMsFor(u){
  var dd=unitState(u); var st=STATIONS[dd.current];
  return (st && st.cycle!=null) ? st.cycle*60000 : null;
}
function timeLeftLabel(u){
  var cyc=cycleMsFor(u);
  var el=workElapsedMs(u);
  if(cyc==null){ // no cycle time (Laser/Paint/Shipping) — just show elapsed
    return {text:fmtDur(el)+" elapsed", over:false, cyc:null};
  }
  var left=cyc-el;
  var over=left<0;
  return {text:(over?"-":"")+fmtDur(Math.abs(left))+" left", over:over, cyc:cyc, left:left};
}
function fmtDur(ms){
  var mins=Math.round(ms/60000);
  if(mins<1){ var s=Math.max(0,Math.floor(ms/1000)); return s+" sec"; }
  return mins+" minute"+(mins===1?"":"s");
}
async function workStart(id){
  var u=state.units.filter(function(x){return x.id===id;})[0]; if(!u)return;
  var w=u.work||{elapsedMs:0};
  var who=(state.role==="worker")?(state._lastEmp||actorLabel()):state.user.email;
  if(state.role==="worker" && !who){ alert("Enter your employee ID first."); return; }
  // If someone else is already running this unit, don't take it over.
  if(w.running && w.operator && String(w.operator)!==String(who)){
    alert("ID "+w.operator+" is already working on this unit. They must pause before someone else takes over.");
    return;
  }
  // Already running and already mine -> nothing to change.
  if(w.running && w.operator && String(w.operator)===String(who)){ render(); return; }
  // Not running, OR running with no operator recorded (legacy) -> claim it now.
  if(!w.running || !w.startedAt){ w.startedAt=isoNow(); }
  w.running=true; w.operator=who; w.operatorAt=isoNow();
  if(w.elapsedMs==null) w.elapsedMs=0;
  u.work=w;
  // Keep a permanent record of EVERY badge that worked this unit, per station,
  // even after a different badge takes it over. Never overwritten.
  var dd=unitState(u);
  var stName=STATIONS[dd.current]?STATIONS[dd.current].full:"";
  var wlog=Array.isArray(u.workLog)?u.workLog.slice():[];
  var lastEntry=wlog.length?wlog[wlog.length-1]:null;
  // Only add a new entry if this badge/station differs from the most recent one (avoids spam on re-start)
  if(!lastEntry || String(lastEntry.by)!==String(who) || lastEntry.station!==stName){
    wlog.push({by:who, station:stName, at:isoNow()});
  }
  u.workLog=wlog;
  try{ await updateDoc(doc(db,"units",id),{work:w, workLog:wlog}); }catch(e){ alert("Couldn't start: "+e.message); return; }
  render();
}
async function workPause(id){
  var u=state.units.filter(function(x){return x.id===id;})[0]; if(!u)return;
  var w=u.work||{elapsedMs:0}; if(!w.running){render();return;}
  w.elapsedMs=workElapsedMs(u); w.running=false; w.startedAt=null;
  w.pausedBy=w.operator||null; w.operator=null; // release: anyone at the station can take over
  u.work=w;
  try{ await updateDoc(doc(db,"units",id),{work:w}); }catch(e){ alert("Couldn't pause: "+e.message); }
  render();
}
// Manager can force-release a unit if a worker walked away without pausing
async function forceRelease(id){
  if(state.role==="worker"){ return; }
  var u=state.units.filter(function(x){return x.id===id;})[0]; if(!u)return;
  var w=u.work||{elapsedMs:0};

  w.elapsedMs=workElapsedMs(u); w.running=false; w.startedAt=null; w.pausedBy=w.operator||null; w.operator=null; w.releasedBy=state.user.email;
  u.work=w;
  try{ await updateDoc(doc(db,"units",id),{work:w}); }catch(e){ alert("Couldn't release: "+e.message); return; }
  render();
}

function setupDragReorder(){
  var container=document.getElementById("unit-rows"); if(!container)return;
  var rows=container.querySelectorAll('.row[draggable="true"]');

  rows.forEach(function(row){
    row.addEventListener("dragstart",function(e){ dragEl=row; state._dragging=true; row.style.opacity="0.4"; try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",row.getAttribute("data-id")||"");}catch(err){} });
    row.addEventListener("dragend",function(){ state._dragging=false; row.style.opacity=""; });
    row.addEventListener("dragover",function(e){ e.preventDefault(); try{e.dataTransfer.dropEffect="move";}catch(err){}
      var after=(e.clientY - row.getBoundingClientRect().top) > (row.offsetHeight/2);
      row.style.borderTop=after?"":"2px solid var(--cyan)";
      row.style.borderBottom=after?"2px solid var(--cyan)":"";
    });
    row.addEventListener("dragleave",function(){ row.style.borderTop=""; row.style.borderBottom=""; });
    row.addEventListener("drop",function(e){ e.preventDefault(); row.style.borderTop=""; row.style.borderBottom="";
      if(!dragEl||dragEl===row)return;
      var after=(e.clientY - row.getBoundingClientRect().top) > (row.offsetHeight/2);

      else row.parentNode.insertBefore(dragEl,row);

  });

function tvTodayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function renderTv(){
  var u=(state.units||[]).filter(function(x){return !x.hiddenFromDash;});
  var d={}; u.forEach(function(x){ d[x.id]=unitState(x); });
  var onLine=0,hold=0,shippedToday=0,dueMonth=0;
  var today=tvTodayISO();
  var thisMonth=today.slice(0,7); // YYYY-MM
  u.forEach(function(x){
    var s=d[x.id].status;
    if(s==="shipped"){
      var sd=null;
      (x.events||[]).forEach(function(e){ if(e.type==="ship"&&e.date) sd=String(e.date).slice(0,10); });
      if(sd===today) shippedToday++;
      return;
    }
    if(s==="rework"||s==="scrapped") return;
    if(s==="hold") hold++; else onLine++;
    var due=unitDueDate(x);
    if(due && due.slice(0,7)===thisMonth) dueMonth++;
  });

  var h='<div class="tv">';
  h+='<div class="tv-head"><div class="tv-brand">Tra<b>yer</b> <span>RMU Production</span></div>'
    +'<div class="tv-clock">'+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</div>'
    +'<button class="tv-exit" data-action="tvexit">Exit</button></div>';

  // ---- Monthly goal banner ----
  var tvGoalMonth=nowMonthKey();
  var tvGoal=(state.goals&&state.goals[tvGoalMonth]!=null)?state.goals[tvGoalMonth]:null;
  if(tvGoal!=null){
    var tvShipped=u.filter(function(x){
      if(d[x.id].status!=="shipped") return false;
      var sd=shipDateForGoal(x); return sd && String(sd).slice(0,7)===tvGoalMonth;
    }).length;
    var tvPct=(tvGoal>0)?Math.min(Math.round(tvShipped/tvGoal*100),100):0;
    var tvCol=(tvShipped>=tvGoal)?"#2ec76a":(tvPct>=70?"#4a9eff":(tvPct>=40?"#ffb020":"#ff5a5a"));
    var tvLbl=new Date(tvGoalMonth+"-01T00:00:00").toLocaleString('default',{month:'long'});
    h+='<div style="display:flex;align-items:center;gap:18px;padding:10px 22px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)">'
      +'<div style="font-size:15px;font-weight:700;color:#fff;letter-spacing:.02em;white-space:nowrap">'+esc(tvLbl)+' Goal</div>'
      +'<div style="flex:1;height:16px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden"><div style="height:100%;width:'+tvPct+'%;background:'+tvCol+';border-radius:8px"></div></div>'
      +'<div style="font-family:var(--disp,inherit);font-weight:800;font-size:22px;color:'+tvCol+';white-space:nowrap">'+tvShipped+' / '+tvGoal+(tvShipped>=tvGoal?'  ✓':'')+'</div>'
      +'</div>';
  }
  h+='<div class="tv-body">';

  // ---- The line ----
  var per=STATIONS.map(function(){return {n:0,bad:false};});
  u.forEach(function(x){ var st=d[x.id]; if(st.status==="shipped"||st.status==="scrapped"||st.status==="rework")return; var c=st.current; per[c].n++; if(st.status==="hold")per[c].bad=true; });
  var maxPer=0; per.forEach(function(p){ if(p.n>maxPer)maxPer=p.n; }); if(maxPer<1)maxPer=1;
  h+='<div class="tv-sec tv-line-sec"><div class="tv-title">The Line</div><div class="tv-linebars">';
  STATIONS.forEach(function(s,i){
    var p=per[i]; var pct=(p.n/maxPer)*100;
    h+='<div class="tv-lbar">'
      +'<div class="tv-lnum">'+(p.n||"")+'</div>'
      +'<div class="tv-lfill '+(p.bad?"bad":(p.n?"":"empty"))+'" style="height:'+(p.n?Math.max(pct,4):0).toFixed(1)+'%"></div>'
      +'<div class="tv-lname">'+esc(s.short)+'</div></div>';
  });
  h+='</div></div>';

  // ---- Three columns: Critical path / Needs attention / Due this month ----
  // Auto-scroll helper: builds a looping track (rows duplicated) when there are enough rows to scroll.
  function tvScrollCol(titleCls, title, rowsHtml, count, emptyMsg){
    var out='<div class="tv-col"><div class="tv-ctitle '+titleCls+'">'+title+'</div>';
    if(count===0){ out+='<div class="tv-cempty">'+emptyMsg+'</div></div>'; return out; }
    // roughly 5 rows fit; scroll only if more than that
    var scroll = count>5;
    var secs = Math.max(12, count*4); // slower for longer lists
    out+='<div class="tv-scroll"><div class="tv-track'+(scroll?'':' still')+'"'+(scroll?' style="animation-duration:'+secs+'s"':'')+'>';
    out+=rowsHtml;
    if(scroll) out+=rowsHtml; // duplicate for a seamless loop
    out+='</div></div></div>';
    return out;
  }

  h+='<div class="tv-cols">';

  var crit=u.filter(function(x){ return x.critical && d[x.id].status!=="shipped" && d[x.id].status!=="scrapped"; });
  var critRows='';
  crit.forEach(function(x){ var st=d[x.id]; var w=x.work||{};

  h+=tvScrollCol("crit","Critical Path",critRows,crit.length,"None right now");

  // needs attention
  var flg=u.filter(function(x){ var s=d[x.id].status; return (x.activeFlag || s==="hold") && s!=="shipped"; });
  var flgRows='';
  flg.forEach(function(x){ var st=d[x.id];
    flgRows+='<div class="tv-crow"><span class="tv-cserial">'+esc(x.id)+'</span>'
      +'<span class="tv-cstn">'+esc(STATIONS[st.current]?STATIONS[st.current].full:"")+'</span>'
      +((x.activeFlag&&x.activeFlag.note)?'<span class="tv-cnote">'+esc(x.activeFlag.note)+'</span>':'')+'</div>'; });
  h+=tvScrollCol("bad","Needs Attention",flgRows,flg.length,"Line is clean");

  // due this month
  var dueList=u.filter(function(x){ var s=d[x.id].status; if(s==="shipped"||s==="scrapped")return false; var due=unitDueDate(x); return due && due.slice(0,7)===thisMonth; })
    .sort(function(a,b){ return String(unitDueDate(a)).localeCompare(String(unitDueDate(b))); });
  var dueRows='';
  dueList.forEach(function(x){ var st=d[x.id]; var due=unitDueDate(x); var dl=daysUntil(due);
    dueRows+='<div class="tv-crow"><span class="tv-cserial">'+esc(x.id)+'</span>'
      +'<span class="tv-cstn">'+esc(STATIONS[st.current]?STATIONS[st.current].full:"")+'</span>'
      +'<span class="tv-cdue'+((dl!=null&&dl<0)?" over":"")+'">'+(dl==null?"":(dl<0?Math.abs(dl)+"d over":dl+"d left"))+'</span></div>'; });
  h+=tvScrollCol("warn","Due This Month",dueRows,dueList.length,"Nothing due");

  h+='</div>'; // cols
  h+='</div>'; // body
  h+='</div>';
  document.getElementById("app").innerHTML=h;
  startTvTimers();
}

  h+='<input type="text" data-pwsearch="active" value="'+esc(state.pwSearch.active||"")+'" placeholder="Search all units by serial, job #, or customer…" style="width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;margin:10px 0">';

function renderReports(){
  var h=topbar();
  h+='<main class="wrap">';

  // Month + Year pickers shared by the Critical / Rework / Shipped tables (each keeps its own choice).
  // Filters by commit date (production due date). "All" on either means no constraint on that part.
  state.tableMonth = state.tableMonth || {};
  state.tableYear = state.tableYear || {};
  function tMonth(key){ return state.tableMonth[key] || "all"; }
  function tYear(key){ return state.tableYear[key] || "all"; }
  function inTPer(u,key){
    var m=tMonth(key), y=tYear(key);
    if(m==="all" && y==="all") return true;
    var due=unitDueDate(u); if(!due) return false;
    var iso=String(due).slice(0,10);
    var yr=iso.slice(0,4), mo=iso.slice(5,7);
    if(y!=="all" && yr!==y) return false;
    if(m!=="all" && mo!==m) return false;
    return true;
  }
  var MONTHS=[["all","All months"],["01","January"],["02","February"],["03","March"],["04","April"],["05","May"],["06","June"],["07","July"],["08","August"],["09","September"],["10","October"],["11","November"],["12","December"]];
  // year list: from the units that exist, plus the current year, newest first
  function tYearList(){
    var set={}; (state.units||[]).forEach(function(u){ var d=unitDueDate(u); if(d) set[String(d).slice(0,4)]=1; });
    set[String(new Date().getFullYear())]=1;
    return Object.keys(set).sort().reverse();
  }
  function tPickers(key){
    var mSel='<select data-tablemonth="'+key+'" style="padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;font-size:12px">';
    MONTHS.forEach(function(o){ mSel+='<option value="'+o[0]+'"'+(tMonth(key)===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
    mSel+='</select>';
    var ySel='<select data-tableyear="'+key+'" style="padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;margin-left:6px">';
    ySel+='<option value="all"'+(tYear(key)==="all"?' selected':'')+'>All years</option>';
    tYearList().forEach(function(y){ ySel+='<option value="'+y+'"'+(tYear(key)===y?' selected':'')+'>'+y+'</option>'; });
    ySel+='</select>';
    return mSel+ySel;
  }

  // ---- Delivery risk: On track / Due soon / At risk / Overdue ----
  // Work remaining = sum of cycle times for stations still to go, converted to workdays at 16h/day (two shifts).
  var HOURS_PER_DAY = 16;
  function workDaysRemaining(u){
    var st=unitState(u);
    var mins=0;
    for(var i=st.current; i<N; i++){
      var c=STATIONS[i] ? STATIONS[i].cycle : null;
      if(c!=null) mins+=c;
    }
    return mins/60/HOURS_PER_DAY; // in workdays (each workday = 16h, two shifts)
  }
  // Working days until commit (Sundays excluded) is handled by the global daysUntil().
  function riskBucket(u){
    var st=unitState(u);
    if(st.status==="shipped"||st.status==="scrapped") return null;
    var due=unitDueDate(u);
    var dleft=daysUntil(due);             // working days left (Sundays excluded)
    if(dleft==null) return "ontrack";
    if(dleft<0) return "overdue";
    if(workDaysRemaining(u)>dleft) return "risk";
    if(dleft<=3) return "soon";
    return "ontrack";
  }
  var sc={ontrack:0,risk:0,soon:0,overdue:0,shipped:0,active:0,early:0};
  var byBucket={ontrack:[],soon:[],risk:[],overdue:[]};
  (state.units||[]).forEach(function(u){
    var st=unitState(u);
    if(st.status==="shipped"){ sc.shipped++; if(u.shippedEarly) sc.early++; return; }
    if(st.status==="scrapped") return;
    sc.active++;
    var b=riskBucket(u);
    if(b){ sc[b]++; byBucket[b].push(u); }
  });
  var totalLive=sc.active;
  function riskCard(key,label,count,color,sub){
    var on=(state.riskFilter===key);
    return '<button class="panel" data-action="riskfilter" data-v="'+key+'" style="margin:0;text-align:center;padding:16px 10px;cursor:pointer;border:'+(on?'2px solid '+color:'1px solid var(--line)')+';background:'+(on?'var(--bg)':'var(--card)')+';font:inherit;width:100%">'
      +'<div style="font-family:var(--disp);font-weight:800;font-size:34px;color:'+color+'">'+count+'</div>'
      +'<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:4px">'+label+'</div>'
      +'<div style="font-size:10.5px;color:var(--ink3);margin-top:3px">'+sub+'</div>'
      +'</button>';
  }
  function statCard(label,count,color){
    return '<div class="panel" style="margin:0;text-align:center;padding:16px 10px">'
      +'<div style="font-family:var(--disp);font-weight:800;font-size:30px;color:'+color+'">'+count+'</div>'
      +'<div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:4px">'+label+'</div></div>';
  }
  h+='<section class="panel"><div class="panel-head"><h2>Delivery risk</h2><span class="hint">Against due dates · work left estimated from station cycle times (two shifts / 16h per day) · '+totalLive+' active, '+sc.shipped+' shipped · click a card to see the units</span></div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">'
    +riskCard("ontrack","On track",sc.ontrack,"var(--green)","comfortable margin")
    +riskCard("soon","Due soon",sc.soon,"#e8a000","due within 3 days")
    +riskCard("risk","At risk",sc.risk,"#d97706","not enough time left")
    +riskCard("overdue","Overdue",sc.overdue,"var(--red)","past due date")
    +'</div>';
  // clicked-card unit list
  if(state.riskFilter && byBucket[state.riskFilter]){
    var lbl={ontrack:"On track",soon:"Due soon",risk:"At risk",overdue:"Overdue"}[state.riskFilter];
    var list=byBucket[state.riskFilter];

function shipDetailHtml(id){
  var u=(state.units||[]).filter(function(x){return x.id===id;})[0];
  if(!u) return '';
  var dd=unitState(u);
  var factory=(u.sheet&&u.sheet.factory)?u.sheet.factory:"—";
  var h='<div class="scrim" data-action="closeship"></div><aside class="drawer" style="max-width:520px">';
  h+='<div class="drawer-head"><div><div class="serial big">'+esc(u.id)+(u.critical?' <span class="pill" style="font-size:10px;vertical-align:middle;background:#c0392b;color:#fff;font-weight:800">★ CRITICAL</span>':'')+(u.isRmaUnit?' <span class="pill" style="font-size:10px;vertical-align:middle;background:#fff3e0;color:#a35b00">RMA unit</span>':'')+(u.isReworkUnit?' <span class="pill s-hold" style="font-size:10px;vertical-align:middle">Rework unit</span>':'')+'</div><div class="drawer-sub">'+esc(u.customer||"")+' · '+esc(u.order||"")+'</div></div><button class="x" data-action="closeship">×</button></div>';
  // rework status + bring-back
  if(dd.status==="rework"){
    h+='<div style="padding:12px 14px;border-radius:10px;background:#fde8e8;border:1px solid #e79a9a;margin-bottom:12px">'
      +'<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9a2a2a;margin-bottom:4px">🔴 In rework · red tag attached</div>'
      +'<div style="font-size:13px;color:#7a1f1f">'+(u.reworkReason?esc(u.reworkReason):"Sent to rework")+(typeof u.reworkStation==="number"&&STATIONS[u.reworkStation]?' · at '+esc(STATIONS[u.reworkStation].full):'')+'</div>'
      +(state.role!=="worker"?'<button class="primary" style="margin-top:10px;width:100%" data-action="reworkbackopen" data-v="'+esc(u.id)+'">Bring back into the line</button>':'')
      +'</div>';
  } else if(u.redTag){
    h+='<div style="padding:10px 12px;border-radius:9px;background:#fde8e8;border:1px solid #e79a9a;color:#9a2a2a;font-size:12.5px;margin-bottom:12px">🔴 Red tag attached'+(u.redTag.by?' by '+esc(u.redTag.by):'')+' — stays until green tag at shipping</div>';
  }
  // meta
  h+='<div class="drawer-meta"><div><span>Customer</span><strong>'+esc(u.customer||"—")+'</strong></div><div><span>Factory</span><strong>'+esc(factory)+'</strong></div><div><span>Model</span><strong>'+esc(u.model||"—")+'</strong></div></div>';
  if(u.createdBy){ h+='<div style="font-size:11.5px;color:var(--ink3);margin:-6px 0 14px">Added by badge #'+esc(u.createdBy)+'</div>'; }
  // documents — visible even after the unit ships
  h+='<div class="traveler-label">Documents</div>'+docSlotsHtml(u, state.role!=="worker");
  // full traveler: who signed off each station + time
  h+='<div class="traveler-label">Traveler · every station</div><ol class="traveler">';
  STATIONS.forEach(function(s,i){
    var stamp=(u.stamps||{})[s.key]||{};
    var done=stamp && !stamp.active && !stamp.hold && (stamp.op||stamp.time);
    var st=done?"done":(stamp.hold?"hold":(stamp.active?"active":"pending"));
    var runningHere=(u.work&&u.work.running)&&stamp.active;
    var lbl=done?"Finished":(stamp.hold?"Had issue":(stamp.active?(runningHere?"In progress":"Waiting"):"—"));
    h+='<li class="tstep '+st+'"><span class="t-mark">'+(done?"":stamp.hold?"!":"")+'</span><div class="t-body"><div class="t-top"><span class="t-name">'+(i+1)+'. '+esc(s.full)+'</span><span class="t-state '+st+'">'+lbl+'</span></div>';
    if(stamp.op||stamp.time){ h+='<div class="t-detail mono">'+(stamp.op&&stamp.op!=="—"?'<span>'+esc(opLabel(stamp.op))+'</span>':'')+(stamp.time?'<span>'+esc(stamp.time)+'</span>':'')+'</div>'; }
    var tb2=stampTimeBadge(stamp); if(tb2){ h+='<div>'+tb2+'</div>'; }
    if(stamp.note){ h+='<div class="t-note '+(stamp.hold?"bad":"")+'">'+esc(stamp.note)+'</div>'; }
    h+='</div></li>';
  });
  h+='</ol>';
  // Everyone who worked this unit (all badges, even after takeovers)
  if(Array.isArray(u.workLog) && u.workLog.length){
    h+='<div class="traveler-label">Who worked on this unit</div>';
    h+='<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:6px">';
    u.workLog.forEach(function(wl){
      var wlWhen=""; try{ wlWhen=fmt12(wl.at); }catch(e){}
      h+='<div style="font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap">'
        +'<span class="mono" style="font-weight:600">Badge '+esc(wl.by||"?")+'</span>'
        +(wl.station?'<span style="color:var(--ink3)">'+esc(wl.station)+'</span>':'')
        +(wlWhen?'<span style="color:var(--ink3)">'+wlWhen+'</span>':'')
        +'</div>';
    });
    h+='</div>';
  }
  // flag history (resolved flags) + any still-active flag — ONE clean list
  var allFlags=[];
  if(Array.isArray(u.flagHistory)) allFlags=allFlags.concat(u.flagHistory);
  if(u.activeFlag) allFlags=allFlags.concat([Object.assign({},u.activeFlag,{_active:true})]);
  if(allFlags.length){
    h+='<div class="traveler-label">Flags</div>';
    allFlags.forEach(function(f){
      var caughtWhen=""; try{ caughtWhen=fmt12(f.at); }catch(e){}
      var fixedWhen=""; try{ if(f.resolvedAt) fixedWhen=fmt12(f.resolvedAt); }catch(e){}
      var stn=f.stationName || ((typeof f.station==="number"&&STATIONS[f.station])?STATIONS[f.station].full:"");
      h+='<div class="rework-flag">'
        +'<div class="rf-title">⚑ '+(stn?esc(stn):"Flagged")+'</div>'
        +'<div class="rf-note">Caught by badge '+esc(f.by||"?")+(caughtWhen?' · '+caughtWhen:'')+'</div>'
        +'<div class="rf-note">Reason: '+esc(f.note||"—")+'</div>'
        +(f.photo?'<div class="rf-note"><a href="'+esc(f.photo)+'" target="_blank" rel="noopener" style="color:#1768d8;font-weight:600">📷 View photo</a></div>':'')
        +(f._active
            ? '<div class="rf-note" style="color:#c0392b">Not yet fixed</div>'
            : '<div class="rf-note">Fixed by badge '+esc(f.resolvedBy||"?")+(f.resolvedStation?' · '+esc(f.resolvedStation):'')+(fixedWhen?' · '+fixedWhen:'')+'</div>')
        +'</div>';
    });
  }
  if(u.greenTag){
    h+='<div class="rework-flag" style="background:#e9f7ec;border-color:#7ac694"><div class="rf-title" style="color:#1f7a3d">Green tag attached</div><div class="rf-note">'+esc(u.greenTag.by||"")+(u.greenTag.at?' · '+String(u.greenTag.at).slice(0,16).replace("T"," "):'')+'</div></div>';
  }
  // comments
  h+='<div class="traveler-label">Comments</div>';
  var cs=Array.isArray(u.comments)?u.comments:[];
  if(cs.length===0){ h+='<div style="color:var(--ink3);font-size:12.5px;padding:2px 0 10px">No comments.</div>'; }
  else {
    cs.slice().reverse().forEach(function(c){
      var when=""; try{ when=fmt12(c.at); }catch(e){}
      h+='<div style="border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:7px">'
        +'<div style="font-size:11px;color:var(--ink3);margin-bottom:3px">'+esc(c.by||"?")+' · '+when+(c.station?' · '+esc(c.station):'')+'</div>'
        +'<div style="font-size:13px;white-space:pre-wrap;word-break:break-word">'+esc(c.text)+'</div>'+(c.photo?'<div style="margin-top:5px"><a href="'+esc(c.photo)+'" target="_blank" rel="noopener" style="font-size:12px;color:#1768d8;font-weight:600">📷 View photo</a></div>':'')+'</div>';
    });
  }
  h+='</aside>';
  return h;
}
